[project]
name = "gemini-bridge"
version = "0.11.1"
description = "Send multimodal tasks to Gemini from Claude Code and get structured answers back"
requires-python = ">=3.11"
dependencies = [
    "google-genai==2.17.0",
    "orjson>=3.10",
    "pyyaml>=6.0",
]

[project.scripts]
gemini-bridge = "gemini_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_bridge"]

[dependency-groups]
dev = ["pytest>=7.0"]
