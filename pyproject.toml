# Virtual workspace root: not a package, so it carries no version.
#
# This repo is a collection of independently-versioned plugins (each versions
# itself in its plugin.json) and CLIs (each versions itself in tools/*/pyproject.toml).
# There is no single "repo version", so the root does not pretend to be one --
# it exists only to declare the uv workspace and shared dev tooling. The
# CHANGELOG's top heading is a standalone narrative marker, not a shadow of a
# package version. See docs/internals/plugin-versioning.md.

[tool.uv.workspace]
members = ["tools/skill-maintainer", "apps/mece-decomposer", "apps/gemini-bridge"]
exclude = ["apps/readwise-reader"]

[tool.uv.sources]
skill-maintainer = { workspace = true }

[dependency-groups]
dev = [
    "pillow==12.3.0",
    "pytest>=7.0",
    "ruff>=0.16",
    "skill-maintainer",
]
